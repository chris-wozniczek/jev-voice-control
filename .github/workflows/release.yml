name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Select newest Xcode 26
        shell: bash
        run: |
          candidates=()
          for candidate in /Applications/Xcode_26.*.app; do
            if [ -d "$candidate" ]; then
              candidates+=("$candidate")
            fi
          done
          if [ "${#candidates[@]}" -gt 0 ]; then
            xcode="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)"
            sudo xcode-select -s "$xcode"
            echo "Selected Xcode: $xcode"
          else
            echo "No Xcode_26.*.app found; retaining the current Xcode"
          fi
          xcodebuild -version

      - name: Check tag matches Info.plist version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Info.plist version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app and zip
        run: make dist

      - name: Verify SpeechAnalyzer engine compiled in
        run: |
          ENGINE_INFO="$("build/Jev Voice.app/Contents/MacOS/JevVoice" --engine-info)"
          echo "$ENGINE_INFO"
          echo "$ENGINE_INFO" | grep -q 'streamingCompiledIn=true' || exit 1

      - name: Compute checksum
        run: echo "SHA256=$(shasum -a 256 "build/Jev-Voice-${VERSION}.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "build/Jev-Voice-${VERSION}.zip" \
            --title "Jev Voice ${VERSION}" \
            --generate-notes

      - name: Update cask version and checksum
        run: |
          sed -i '' -E "s/^  version \".*\"$/  version \"${VERSION}\"/" Casks/jev-voice.rb
          sed -i '' -E "s/^  sha256 .*$/  sha256 \"${SHA256}\"/" Casks/jev-voice.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/jev-voice.rb
          git commit -m "cask: jev-voice ${VERSION}" || exit 0
          git push origin HEAD:main
