name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check tag matches Info.plist version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Info.plist version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build app and zip
        run: make dist

      - name: Compute checksum
        run: echo "SHA256=$(shasum -a 256 "build/Jev-Voice-${VERSION}.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "build/Jev-Voice-${VERSION}.zip" \
            --title "Jev Voice ${VERSION}" \
            --generate-notes

      - name: Update cask version and checksum
        run: |
          sed -i '' -E "s/^  version \".*\"$/  version \"${VERSION}\"/" Casks/jev-voice.rb
          sed -i '' -E "s/^  sha256 .*$/  sha256 \"${SHA256}\"/" Casks/jev-voice.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/jev-voice.rb
          git commit -m "cask: jev-voice ${VERSION}" || exit 0
          git push origin HEAD:main
