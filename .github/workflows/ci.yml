name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        shell: bash
        run: |
          candidates=()
          for candidate in /Applications/Xcode_26.*.app; do
            if [ -d "$candidate" ]; then
              candidates+=("$candidate")
            fi
          done
          if [ "${#candidates[@]}" -gt 0 ]; then
            xcode="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)"
            sudo xcode-select -s "$xcode"
            echo "Selected Xcode: $xcode"
          else
            echo "No Xcode_26.*.app found; retaining the current Xcode"
          fi
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
